# -----------------------------------------------------------------------------
# 网站基本设置
# -----------------------------------------------------------------------------
title: Linghao Shen | 申凌皓
email: shenlinghao@tju.edu.cn
description: >- # 网站描述（用于SEO）
  Assistant Professor at Tianjin University. Research interests: Polarization Imaging, Marine Optics, Computational Imaging, Machine Vision.
baseurl: "" # 留空，使用根域名
url: "https://ShenLH93.github.io" # 替换为你的GitHub Pages地址
lang: en # 主语言为英文，支持中英文混排

# -----------------------------------------------------------------------------
# 作者信息（全局显示）
# -----------------------------------------------------------------------------
author:
  name: Linghao Shen
  first_name: Linghao
  last_name: Shen
  middle_name: ""
  avatar: assets/img/profile.jpg # 你的头像，上传到这个路径
  bio: >-
    Assistant Professor, School of Marine Science and Technology, Tianjin University.
    My research focuses on polarization imaging, marine optics and computational imaging for underwater environments.
  affiliation: Tianjin University
  location: Tianjin, China
  email: shenlinghao@tju.edu.cn
  # 以下链接按需填写，留空则不显示
  scholar: # 谷歌学术ID
  github: # GitHub用户名
  orcid: # ORCID号
  linkedin: # LinkedIn用户名
  researchgate: # ResearchGate用户名

# -----------------------------------------------------------------------------
# 导航栏设置（和樊学强主页保持一致的极简结构）
# -----------------------------------------------------------------------------
navbar:
  enable: true
  sticky: true
  logo:
    enable: false # 关闭logo，只显示文字
  nav:
    - title: About
      url: /
    - title: Research
      url: /research/
    - title: Publications
      url: /publications/
    - title: Projects
      url: /projects/
    - title: Awards
      url: /awards/
    - title: CV
      url: /cv/

# -----------------------------------------------------------------------------
# 功能开关
# -----------------------------------------------------------------------------
enable_darkmode: true # 开启深色模式
enable_copy_code_button: true
enable_math: true # 支持LaTeX公式
enable_google_analytics: false # 关闭谷歌分析，需要时再开启
enable_google_scholar_stats: false # 关闭自动同步谷歌学术，需要时再开启

# -----------------------------------------------------------------------------
# 论文设置
# -----------------------------------------------------------------------------
publications:
  date_format: "%Y"
  sort_by: year
  sort_order: descending
  display_abstract: false # 默认不显示摘要，点击展开
  display_bibtex: true # 显示BibTeX引用
